name: Deploy client to GitHub Pages

# Builds the client and publishes it to GitHub Pages on every push to main.
#
# Requires Settings > Pages > Build and deployment > Source: GitHub Actions.
# The VITE_* values are repository variables (Settings > Secrets and variables >
# Actions > Variables), not secrets, because they are compiled into the public
# JavaScript. Never put the database password or service_role key in them.

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, cancel the older run rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Skip quietly when there is no client to build.
      - id: check
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ -f client/package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No client/package.json, so there is nothing to build yet."
          fi
          # GitHub Pages only publishes public repositories on a free account.
          if [ "$IS_PRIVATE" = "true" ]; then
            echo "::warning::This repository is private, so GitHub Pages cannot publish it and the deploy step will be skipped. Make it public (Settings > General > Danger Zone > Change visibility) to get your live link."
          fi

      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - if: steps.check.outputs.ready == 'true'
        working-directory: client
        run: npm ci

      - name: Build
        if: steps.check.outputs.ready == 'true'
        working-directory: client
        env:
          # Project pages are served from username.github.io/<repo>/, so assets need this prefix.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_USE_MOCK_API: ${{ vars.VITE_USE_MOCK_API }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        # npm run build copies index.html to 404.html for direct links to missing paths.
        run: npm run build

      - if: steps.check.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@0252fc4ba7626f0298f0cf00902a25c6afc77fa8
        with:
          path: client/dist

  deploy:
    needs: build
    # Skipped, not failed, when there is nothing to build or the repository is private.
    if: needs.build.outputs.ready == 'true' && github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
