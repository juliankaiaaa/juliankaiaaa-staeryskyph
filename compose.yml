# Only needed if you self-host. See page 11 of content/extending-your-app.
#
#   cp .env.example .env      # then set the database passwords
#   docker compose up -d
#   docker compose logs -f api
#
# Nothing here is required for the GitHub Pages deployment, which builds the
# client only and needs no server at all.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: haunted
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/db/02-user.sh:/docker-entrypoint-initdb.d/02-user.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d haunted']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://staery_app:${POSTGRES_APP_PASSWORD}@db:5432/haunted
      CORS_ORIGINS: ${CORS_ORIGINS}
      NODE_ENV: production
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  pgdata: